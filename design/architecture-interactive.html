<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>ISA Spectrum · 可插拔 MFA 模块 · 交互式架构图</title>
<style>
  :root{
    --host-fill:#eaf3ff; --host-stroke:#5b8dd6;
    --mfa-fill:#fff7e6;  --mfa-stroke:#d99114;
    --ext-fill:#eef7ee;  --ext-stroke:#4c9a52;
    --sub-stroke:#b9c6d8;
    --ink:#2b3a4a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; background:#f4f6f9; color:var(--ink); height:100vh; display:flex; flex-direction:column; overflow:hidden;}
  header{padding:10px 18px; background:#fff; border-bottom:1px solid #e3e8ef;}
  header h1{font-size:17px; font-weight:700;}
  header p{font-size:12px; color:#68788c; margin-top:2px;}
  #toolbar{display:flex; gap:8px; padding:8px 18px; background:#fff; border-bottom:1px solid #e3e8ef; flex-wrap:wrap; align-items:center;}
  #toolbar button{border:1px solid #c8d3e0; background:#fff; padding:6px 14px; border-radius:16px; font-size:13px; cursor:pointer; color:#3b4a5c;}
  #toolbar button:hover{border-color:#5b8dd6; color:#2f6bbf;}
  #toolbar button.on{background:#2f6bbf; border-color:#2f6bbf; color:#fff;}
  #toolbar .spacer{flex:1;}
  #toolbar .hint{font-size:12px; color:#8a99ab;}
  main{flex:1; display:flex; min-height:0;}
  #canvasWrap{flex:1; position:relative; min-width:0;}
  svg{width:100%; height:100%; display:block; cursor:grab; touch-action:none;}
  svg.dragging{cursor:grabbing;}
  /* —— 图元 —— */
  .group-box{fill:#fbfcfe; stroke:var(--sub-stroke); stroke-width:1.5; rx:10;}
  .group-host{fill:var(--host-fill); stroke:var(--host-stroke);}
  .group-mfa{fill:var(--mfa-fill); stroke:var(--mfa-stroke); stroke-width:2.5;}
  .group-ext{fill:var(--ext-fill); stroke:var(--ext-stroke);}
  .group-title{font-size:13px; font-weight:700; fill:#44566b;}
  .node-box{fill:#fff; stroke:#8fa3ba; stroke-width:1.2; rx:7; cursor:pointer;}
  .node-box:hover{stroke:#2f6bbf; stroke-width:2;}
  .node-mfa-fe{stroke:var(--mfa-stroke);}
  .node-mfa-ef{stroke:#b3541e; fill:#fff4ec;}
  .node-mfa-db{stroke:#7a5fb5; fill:#f5f0fc;}
  .node-title{font-size:12.5px; font-weight:600; fill:var(--ink); pointer-events:none;}
  .node-sub{font-size:10px; fill:#7a8a9c; pointer-events:none;}
  .edge{fill:none; stroke:#9db1c7; stroke-width:1.6;}
  .edge.hook{stroke-dasharray:6 4; stroke:#2aa198;}
  .edge.api{stroke:#2f6bbf;}
  .edge.data{stroke:#7a5fb5;}
  .edge.ext{stroke:#d99114;}
  .edge.biz{stroke:#9aa8b8; stroke-dasharray:2 3;}
  .edge.sdk{stroke:#b3924f;}
  .edge.rls{stroke:#2aa198;}
  .edge-label{font-size:10px; fill:#5d7089; paint-order:stroke; stroke:#f4f6f9; stroke-width:3px;}
  svg.flow-on .edge{opacity:.10;}
  svg.flow-on .edge.active{opacity:1; stroke-width:3.2;}
  svg.flow-on .edge-label{opacity:.10;}
  svg.flow-on .edge-label.active{opacity:1; font-weight:700;}
  svg.flow-on .node{opacity:.28;}
  svg.flow-on .node.lit{opacity:1;}
  svg.flow-on .group{opacity:.45;}
  svg.flow-on .group.lit{opacity:1;}
  /* —— 详情面板 —— */
  #panel{width:340px; background:#fff; border-left:1px solid #e3e8ef; overflow-y:auto; padding:18px; display:none;}
  #panel.open{display:block;}
  #panel h2{font-size:15px; margin-bottom:2px;}
  #panel .tag{display:inline-block; font-size:11px; padding:2px 8px; border-radius:10px; background:#eef3fa; color:#3b5b82; margin:6px 4px 10px 0;}
  #panel p{font-size:13px; line-height:1.7; margin-bottom:10px;}
  #panel li{font-size:12.5px; line-height:1.8; margin-left:18px;}
  #panel .doc{font-size:12px; color:#2f6bbf; margin-top:12px; border-top:1px dashed #dde5ee; padding-top:10px;}
  #panel .close{float:right; border:none; background:none; font-size:16px; cursor:pointer; color:#8a99ab;}
  footer{padding:6px 18px; font-size:11.5px; color:#8a99ab; background:#fff; border-top:1px solid #e3e8ef;}
  footer b{color:#4c5d70;}
</style>
</head>

/* ================= 渲染 ================= */
const svg = document.getElementById('svg');
const NS = 'http://www.w3.org/2000/svg';
const el = (n, attrs) => { const e = document.createElementNS(NS, n); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
const center = n => ({x:n.x + n.w/2, y:n.y + n.h/2});
const byId = Object.fromEntries(NODES.map(n => [n.id, n]));

function edgePath(a, b){
  const p1 = center(a), p2 = center(b);
  const dx = p2.x - p1.x, dy = p2.y - p1.y;
  const cx = (p1.x + p2.x)/2, cy = (p1.y + p2.y)/2;
  const k = Math.min(0.25, Math.abs(dy)/Math.abs(dx||1) * 0.12 + 0.12);
  const sign = (dx >= 0 ? 1 : -1);
  return `M ${p1.x} ${p1.y} Q ${cx} ${cy - sign*0}, ${p2.x} ${p2.y}`;
}
function render(){
  /* 组 */
  for (const g of GROUPS){
    const grp = el('g', {class:'group', id:'grp-'+g.id});
    grp.appendChild(el('rect', {x:g.x, y:g.y, width:g.w, height:g.h, rx:12, class:'group-box ' + g.cls}));
    const t = el('text', {x:g.x+14, y:g.y+26, class:'group-title'});
    t.textContent = g.title; grp.appendChild(t);
    svg.appendChild(grp);
  }
  /* 边 */
  for (let i=0; i<EDGES.length; i++){
    const e = EDGES[i];
    const path = el('path', {d: edgePath(byId[e.f], byId[e.t]), class:'edge '+e.k, id:'edge-'+i});
    svg.appendChild(path);
    if (e.lb){
      const p1 = center(byId[e.f]), p2 = center(byId[e.t]);
      const lb = el('text', {x:(p1.x+p2.x)/2, y:(p1.y+p2.y)/2 - 6, class:'edge-label', 'text-anchor':'middle', id:'elabel-'+i});
      lb.textContent = e.lb; svg.appendChild(lb);
    }
  }
  /* 节点 */
  for (const n of NODES){
    const grp = el('g', {class:'node', id:'node-'+n.id});
    const multi = (n.s||'').includes('\n');
    const h = multi ? n.h + 16 : n.h;
    grp.appendChild(el('rect', {x:n.x, y:n.y, width:n.w, height:h, rx:8, class:'node-box ' + (n.cls||'')}));
    const t = el('text', {x:n.x+n.w/2, y:n.y + (multi?18:19), class:'node-title', 'text-anchor':'middle'});
    t.textContent = n.t; grp.appendChild(t);
    const lines = (n.s||'').split('\n');
    lines.forEach((ln, i) => {
      const s = el('text', {x:n.x+n.w/2, y:n.y + (multi?34:36) + i*13, class:'node-sub', 'text-anchor':'middle'});
      s.textContent = ln; grp.appendChild(s);
    });
    grp.addEventListener('click', ev => { ev.stopPropagation(); showPanel(n); });
    svg.appendChild(grp);
  }
}
render();

/* ================= 面板 ================= */
const panel = document.getElementById('panel');
const panelBody = document.getElementById('panelBody');
function showPanel(n){
  const d = n.d || {};
  panelBody.innerHTML =
    `<h2>${n.t}</h2>` +
    `<span class="tag">${d.tag||''}</span>` +
    `<p>${d.role||''}</p>` +
    (d.pts ? '<ul>' + d.pts.map(p=>`<li>${p}</li>`).join('') + '</ul>' : '') +
    (d.docs ? `<div class="doc">📄 详见：${d.docs}</div>` : '');
  panel.classList.add('open');
}
document.getElementById('panelClose').onclick = () => panel.classList.remove('open');
svg.addEventListener('click', () => panel.classList.remove('open'));

/* ================= 链路高亮 ================= */
document.querySelectorAll('#toolbar button[data-flow]').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('#toolbar button').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    const f = btn.dataset.flow;
    svg.classList.toggle('flow-on', f !== 'all');
    EDGES.forEach((e, i) => {
      const lit = f !== 'all' && e.fl.includes(f);
      document.getElementById('edge-'+i).classList.toggle('active', lit);
      const lbEl = document.getElementById('elabel-'+i);
      if (lbEl) lbEl.classList.toggle('active', lit);
    });
    NODES.forEach(n => {
      const lit = f === 'all' || EDGES.some((e,i) => e.fl.includes(f) && (e.f===n.id || e.t===n.id));
      document.getElementById('node-'+n.id).classList.toggle('lit', lit);
    });
    GROUPS.forEach(g => {
      const lit = f === 'all' || NODES.some(n => n.g===g.id && EDGES.some(e => e.fl.includes(f) && (e.f===n.id || e.t===n.id)));
      document.getElementById('grp-'+g.id).classList.toggle('lit', lit);
    });
  };
});

/* ================= 平移缩放 ================= */
let vb = {x:0, y:0, w:1720, h:1000};
const apply = () => svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
document.getElementById('resetView').onclick = () => { vb = {x:0,y:0,w:1720,h:1000}; apply(); };
svg.addEventListener('wheel', ev => {
  ev.preventDefault();
  const k = ev.deltaY > 0 ? 1.12 : 0.89;
  const r = svg.getBoundingClientRect();
  const mx = vb.x + (ev.clientX - r.left)/r.width * vb.w;
  const my = vb.y + (ev.clientY - r.top)/r.height * vb.h;
  const nw = Math.min(4000, Math.max(500, vb.w * k));
  const nh = nw * vb.h / vb.w;
  vb.x = mx - (mx - vb.x) * nw/vb.w;
  vb.y = my - (my - vb.y) * nh/vb.h;
  vb.w = nw; vb.h = nh; apply();
}, {passive:false});
let drag = null;
svg.addEventListener('mousedown', ev => { drag = {x:ev.clientX, y:ev.clientY, vx:vb.x, vy:vb.y}; svg.classList.add('dragging'); });
window.addEventListener('mousemove', ev => {
  if (!drag) return;
  const r = svg.getBoundingClientRect();
  vb.x = drag.vx - (ev.clientX - drag.x)/r.width * vb.w;
  vb.y = drag.vy - (ev.clientY - drag.y)/r.height * vb.h;
  apply();
});
window.addEventListener('mouseup', () => { drag = null; svg.classList.remove('dragging'); });
</script>
